name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest becomes Ubuntu 26 from 2026-10-19 (the page tests use its preinstalled Chrome)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Opens every page in Chrome (preinstalled on the runner) against the build, on sample data (no database keys
      # here), and fails on errors, blank pages or sideways scrolling. See e2e/pages.e2e.ts.
      - name: Page smoke test
        run: npm run test:pages
