name: Data monitor

# Once a day: fails (and GitHub emails the repository owner) if the live data hasn't been updated for 8 hours or more
# (full ingest runs every 6 hours, so the ingest has stopped) or if more than 3% of records trip a data-quality rule.
# Read-only, about a minute of Actions time. Visitors see the same staleness as an amber "Delayed" pill in the top bar.
on:
  schedule:
    - cron: "15 13 * * *" # 9:15am New York
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04 # pinned, like ci.yml
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Freshness and data quality
        run: npm run audit -- --max-age 8 --max-flagged 3

  # Keeps the rebuilds' filed-document cache (ingest.yml) alive: GitHub drops a cache nobody has restored for 7 days, and
  # rebuilds come weeks apart. A full restore (a few gigabytes, a minute or two) is what counts as a use; a lookup alone may
  # not. Its own job, so it neither shares the check's 10 minutes nor fails it. Nothing to restore is fine.
  keep-document-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: .data/cache
          key: edgar-docs-keepalive
          restore-keys: edgar-docs-
