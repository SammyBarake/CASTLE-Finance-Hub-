name: Ingest SEC data

# Pulls new EDGAR filings into Supabase every 3 hours.
# Run it by hand from the Actions tab ("Run workflow"); set "from" (YYYY-MM-DD) for a backfill.
on:
  schedule:
    # Every 3 hours (UTC). A normal run takes a few minutes, well inside the free Actions allowance.
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Backfill start date (YYYY-MM-DD). Leave empty for the normal daily window."
        required: false
        default: ""
      rebuild:
        description: "Rebuild all deals from scratch with the current parsers (uses 'from', default 2021-01-01) and reload activist 13Ds. Removes stale or wrong deals. The first full run takes 1-2 hours."
        type: boolean
        required: false
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    # A normal run takes minutes; a full rebuild from 2021 can take a couple of hours (GitHub's cap is 6).
    timeout-minutes: 350
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check secrets are configured
        run: |
          for v in SEC_USER_AGENT SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done
      - name: Ingest
        run: |
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            npm run ingest -- --only deals --rebuild-deals --from "${{ inputs.from || '2021-01-01' }}"
            npm run ingest -- --only activists --from 2024-12-18
          elif [ -n "${{ inputs.from }}" ]; then
            npm run ingest -- --from "${{ inputs.from }}"
          else
            npm run ingest
          fi
