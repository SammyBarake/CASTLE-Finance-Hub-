name: Ingest SEC data

# Pulls new EDGAR filings into Supabase: a full run every 6 hours, plus quick hourly runs through the US business day.
# Run it by hand from the Actions tab ("Run workflow"); set "from" (YYYY-MM-DD) for a backfill.
on:
  schedule:
    # Full run every 6 hours (UTC): new filings, status / enrichment, IPOs, activists, macro. A few minutes each.
    - cron: "20 */6 * * *"
    # Quick run hourly on weekdays 11:50-23:50 UTC (about 7:50am-7:50pm New York), when EDGAR publishes most
    # filings: only the last two days, no macro. About 2 minutes each. Together roughly 1,200-1,400 of the
    # 2,000 free Actions minutes a month for a private repository (unlimited if the repository is public).
    - cron: "50 11-23 * * 1-5"
  workflow_dispatch:
    inputs:
      from:
        description: "Backfill start date (YYYY-MM-DD). Leave empty for the normal daily window."
        required: false
        default: ""
      rebuild:
        description: "Rebuild all deals from scratch with the current parsers (uses 'from', default 2021-01-01) and reload activist 13Ds. Removes stale or wrong deals. Takes about 3-4 hours; the site keeps its last full data until it finishes. If it runs short of time it stops at 285 minutes, and the next scheduled run finishes the enriching."
        type: boolean
        required: false
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04 # pinned, like ci.yml
    # A normal run takes minutes; a full rebuild from 2021 takes about 4 hours (GitHub's cap is 6).
    timeout-minutes: 350
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check secrets are configured
        run: |
          for v in SEC_USER_AGENT SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done
      # A rebuild reads about 30,000 filed documents, which never change: it starts from the last rebuild's copies (the
      # newest saved cache) and saves its own at the end, so it only downloads what's new. About 69,000 requests at 8 a
      # second took 4.4 hours on November 14. Ordinary runs read too little to be worth restoring gigabytes for. GitHub
      # drops a cache unused for 7 days, so monitor.yml restores it daily to keep it.
      - name: Restore the filed-document cache (rebuilds)
        id: docs-cache
        if: ${{ inputs.rebuild }}
        uses: actions/cache/restore@v4
        with:
          path: .data/cache
          key: edgar-docs-${{ github.run_id }}
          restore-keys: edgar-docs-
      # --deadline-minutes stops a run and saves before the job limit (350 minutes) kills it: a killed run saves nothing
      # after its last checkpoint. A rebuild that runs out of time while enriching still prunes stale deals and leaves the
      # rest for the next run; one that runs out while reading filings keeps everything (ingest/run.ts).
      # A rebuild reloads the activists first: that step moves `asOf`, which must wait until the deals are all enriched.
      - name: Ingest
        run: |
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            export EDGAR_CACHE_DIR=.data/cache
            if [ -z "${{ steps.docs-cache.outputs.cache-matched-key }}" ]; then
              echo "::warning::No saved document cache: this rebuild downloads every filing (about 69,000 requests, over 4 hours)"
            fi
            npm run ingest -- --only activists --from 2024-12-18
            npm run ingest -- --only deals --rebuild-deals --from "${{ inputs.from || '2021-01-01' }}" --deadline-minutes 285
          elif [ -n "${{ inputs.from }}" ]; then
            npm run ingest -- --from "${{ inputs.from }}" --deadline-minutes 325
          elif [ "${{ github.event.schedule }}" = "50 11-23 * * 1-5" ]; then
            npm run ingest -- --from "$(date -u -d '2 days ago' +%F)" --skip macro --deadline-minutes 325
          else
            npm run ingest -- --deadline-minutes 325
          fi
      # Saved even when the rebuild failed or ran out of time: what it downloaded is still good for the next one. A document is
      # written under a temporary name and renamed into place (ingest/edgar.ts), so a killed run leaves only *.tmp files,
      # which are removed here rather than saved.
      - name: Cache size (rebuilds)
        if: ${{ always() && inputs.rebuild }}
        run: |
          find .data/cache -name '*.tmp' -delete || true
          du -sh .data/cache || true
          ls .data/cache | wc -l || true
          df -h . || true
      - name: Save the filed-document cache (rebuilds)
        if: ${{ always() && inputs.rebuild }}
        uses: actions/cache/save@v4
        with:
          path: .data/cache
          key: edgar-docs-${{ github.run_id }}-${{ github.run_attempt }}
      # Fails the run (and GitHub emails) if more than 3% of records trip a data-quality rule (ingest/audit-rules.ts).
      # Read-only, no EDGAR requests, a few seconds.
      - name: Data quality
        run: npm run audit -- --max-flagged 3
