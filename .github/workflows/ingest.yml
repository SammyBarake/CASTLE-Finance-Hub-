name: Ingest SEC data

# Pulls new EDGAR filings into Supabase: a full run every 6 hours, plus quick hourly runs through the US business day.
# Run it by hand from the Actions tab ("Run workflow"); set "from" (YYYY-MM-DD) for a backfill.
on:
  schedule:
    # Full run every 6 hours (UTC): new filings, status / enrichment, IPOs, activists, macro. A few minutes each.
    - cron: "20 */6 * * *"
    # Quick run hourly on weekdays 11:50-23:50 UTC (about 7:50am-7:50pm New York), when EDGAR publishes most
    # filings: only the last two days, no macro. About 2 minutes each. Together roughly 1,200-1,400 of the
    # 2,000 free Actions minutes a month for a private repository (unlimited if the repository is public).
    - cron: "50 11-23 * * 1-5"
  workflow_dispatch:
    inputs:
      from:
        description: "Backfill start date (YYYY-MM-DD). Leave empty for the normal daily window."
        required: false
        default: ""
      rebuild:
        description: "Rebuild all deals from scratch with the current parsers (uses 'from', default 2021-01-01) and reload activist 13Ds. Removes stale or wrong deals. The first full run takes 1-2 hours."
        type: boolean
        required: false
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    # A normal run takes minutes; a full rebuild from 2021 can take a couple of hours (GitHub's cap is 6).
    timeout-minutes: 350
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check secrets are configured
        run: |
          for v in SEC_USER_AGENT SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done
      - name: Ingest
        run: |
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            npm run ingest -- --only deals --rebuild-deals --from "${{ inputs.from || '2021-01-01' }}"
            npm run ingest -- --only activists --from 2024-12-18
          elif [ -n "${{ inputs.from }}" ]; then
            npm run ingest -- --from "${{ inputs.from }}"
          elif [ "${{ github.event.schedule }}" = "50 11-23 * * 1-5" ]; then
            npm run ingest -- --from "$(date -u -d '2 days ago' +%F)" --skip macro
          else
            npm run ingest
          fi
